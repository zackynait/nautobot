{% load helpers %}

<div class="mb-3">
    <label class="form-label">Filtra per Tenant</label>
    <div class="list-group">
        <a href="{% url 'core:home' %}" class="list-group-item list-group-item-action {% if not selected_tenant %}active{% endif %}">
            -- Tutti i Tenant --
        </a>
        {% for tenant in tenants %}
            <a href="{% url 'core:home' %}?tenant={{ tenant.id }}" class="list-group-item list-group-item-action {% if selected_tenant and selected_tenant.id == tenant.id %}active{% endif %}">
                {{ tenant.name }}
            </a>
        {% empty %}
            <div class="list-group-item">Nessun tenant disponibile</div>
        {% endfor %}
    </div>
    {% if selected_tenant %}
    <div class="mt-2">
        <small class="text-muted">Tenant selezionato: <strong>{{ selected_tenant.name }}</strong></small>
    </div>
    {% endif %}
</div>
